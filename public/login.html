<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEDE6">
<title>Log in · Gym Log</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/css/styles.css">
<script src="/js/ui.js" defer></script>
<script src="/js/pages/login.js" defer></script>
</head>
<body>
<div class="auth-wrap">
  <main class="auth-card">
    <p class="brand">Gym Log</p>
    <div class="card pad stack-lg">
      <div class="seg" role="group" aria-label="Log in or sign up" style="align-self: flex-start;">
        <button type="button" id="tab-login" aria-pressed="true">Log in</button>
        <button type="button" id="tab-signup" aria-pressed="false">Create account</button>
      </div>
      <form id="auth-form" class="stack-lg" novalidate>
        <div class="field" id="name-field" hidden>
          <label for="name">Name</label>
          <input class="input" id="name" name="name" autocomplete="name" maxlength="60">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required minlength="8">
          <span class="tiny muted" id="pw-hint" hidden>At least 8 characters.</span>
        </div>
        <p class="form-error" id="auth-error" role="alert" hidden></p>
        <button class="btn btn-primary btn-block" type="submit" id="auth-submit">Log in</button>
      </form>
    </div>
  </main>
</div>
</body>
</html>
